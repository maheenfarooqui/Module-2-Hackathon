<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background:#0f172a; color:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

  <div style="background:#1e293b; padding:30px; border-radius:12px; border:1px solid #22d3ee; width:300px; text-align:center;">
    <h2 style="color:#22d3ee; margin-top:0;">New Password</h2>
    
    <input type="password" id="newPasswordInput" placeholder="Enter new password" style="width:100%; padding:10px; margin:15px 0; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; box-sizing:border-box;">
    
    <button id="updatePassBtn" style="width:100%; padding:10px; background:#22d3ee; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">
      Update Password
    </button>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    const supbaseUrl = "https://dpheuwopfkpdynfgjthm.supabase.co";
    const supbaseKey = "sb_publishable_dOaRFmzPIgKgPV5pZDfq0w_vL3GxXdO";
    const supabase = createClient(supbaseUrl, supbaseKey);

    document.getElementById("updatePassBtn").addEventListener("click", async () => {
      const newPassword = document.getElementById("newPasswordInput").value.trim();

      if (!newPassword) {
        Swal.fire({ icon: "error", title: "Please enter password" });
        return;
      }

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        Swal.fire({ icon: "error", title: "Error", text: error.message });
      } else {
        Swal.fire({
          icon: "success",
          title: "Password Updated!",
          text: "Redirecting to login page...",
          timer: 2000,
          showConfirmButton: false,
        }).then(() => {
          window.location.href = "index.html"; // Aapka login page URL
        });
      }
    });
  </script>
</body>
</html>
