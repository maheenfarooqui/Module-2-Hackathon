<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll System — QuadPulse</title>

  <!-- Google Fonts Embed Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/poll.css" />

  <style>
    /* Profile dropdown and input safety fixes */
    .hidden, input[type="file"].hidden-input { display: none !important; }
    .dropdown-menu { display: none; }
    .dropdown-menu.show { display: block !important; }
  </style>
</head>
<body>

  <!-- HEADER NAVBAR (EXACT FROM DASHBOARD.HTML) -->
  <header class="navbar">
    <div class="nav-container">
      
      <a href="dashboard.html" class="brand-logo">
        <div class="brand-logo" id="authLogo">
          
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 100"
            width="42"
            height="42"
            fill="none"
          >
            <defs>
              <!-- Cyan to Dark Teal Gradient -->
              <linearGradient
                id="qpGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#72f2eb" />
                <stop offset="100%" stop-color="#0e8388" />
              </linearGradient>

              <!-- Neon Glow Effect -->
              <filter
                id="qpGlow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
              >
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- Hexagonal Dark Border Frame -->
            <path
              d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z"
              stroke="rgba(114, 242, 235, 0.25)"
              stroke-width="2.5"
              fill="rgba(5, 22, 24, 0.6)"
            />

            <!-- Integrated "Q" + "P" Minimalist Cyber Path -->
            <!-- "Q" Outer Circle & Tail -->
            <path
              d="M50 24 C35 24 25 35 25 50 C25 65 35 76 50 76 C65 76 75 65 75 50 C75 35 65 24 50 24 Z"
              stroke="url(#qpGradient)"
              stroke-width="5"
              stroke-linecap="round"
            />

            <!-- "P" Vertical Stem & Loop Blend -->
            <path
              d="M38 34 L38 68"
              stroke="#72f2eb"
              stroke-width="5"
              stroke-linecap="round"
              filter="url(#qpGlow)"
            />

            <path
              d="M38 34 C50 30 62 38 62 48 C62 58 50 62 38 62"
              stroke="url(#qpGradient)"
              stroke-width="4.5"
              stroke-linecap="round"
              fill="none"
            />

            <!-- "Q" Pulse Accent Tail -->
            <path
              d="M58 58 L72 72"
              stroke="#72f2eb"
              stroke-width="5"
              stroke-linecap="round"
              filter="url(#qpGlow)"
            />

            <!-- Pulse Center Glow Node -->
            <circle
              cx="50"
              cy="50"
              r="3.5"
              fill="#72f2eb"
              filter="url(#qpGlow)"
            />
          </svg>
          <span class="logo-text">Quad<span>Pulse</span></span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="nav-menu" id="navMenu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="communitypost.html" class="nav-link">Posts</a>
        <a href="event.html" class="nav-link">Events</a>
        <a href="studypartnerfinder.html" class="nav-link">Study Partners</a>
        <a href="poll.html" class="nav-link active">Polls</a>
      </nav>

      <!-- Right User Actions -->
      <div class="user-actions">
        <button class="notif-btn" title="Notifications">
          <i class="fa-solid fa-bell"></i>
          <span class="notif-badge"></span>
        </button>

        <!-- User Profile Dropdown -->
        <div class="profile-dropdown-wrapper">
          <div class="user-profile-trigger" id="profileTrigger">
            <div class="avatar-circle" id="avatarCircle">
              <span id="avatarInitials">AH</span>
              <img
                id="avatarImage"
                src=""
                alt="Profile"
                class="avatar-img hidden"
              />
            </div>
            <span class="user-name" id="userNameDisplay">Ali Hassan</span>
            <i class="fa-solid fa-chevron-down dropdown-icon"></i>
          </div>

          <!-- Dropdown Menu -->
          <div class="dropdown-menu" id="profileDropdown">
            <label for="profilePicInput" class="dropdown-item">
              <i class="fa-solid fa-camera"></i>
              <span>Upload Profile Picture</span>
              <input
                type="file"
                id="profilePicInput"
                accept="image/*"
                class="hidden-input"
              />
            </label>
            <a href="userDashboard.html" class="dropdown-item">
              <i class="fa-solid fa-gauge"></i>
              <span>Go to Your Dashboard</span>
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" id="logoutBtn">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>

        <!-- Mobile Menu Hamburger -->
        <button class="mobile-toggle" id="mobileToggle">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN POLL CONTAINER -->
  <div class="poll-container" style="margin-top: 30px;">
    <!-- Header Action -->
    <div class="poll-header">
      <h2><i class="fa-solid fa-users"></i> Campus Polls</h2>
      <button class="btn btn-accent gsap-btn" onclick="openPollModal()">
        <i class="fa-solid fa-plus-circle"></i> Create Poll
      </button>
    </div>

    <!-- Active Polls Grid -->
    <div class="polls-grid" id="polls-list">
      <!-- Poll cards will be generated dynamically -->
    </div>
  </div>

  <!-- Create Poll Modal -->
  <div class="modal-overlay" id="createPollModal">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3 class="text-accent">Create New Poll</h3>
        <button class="close-btn" onclick="closePollModal()">&times;</button>
      </div>
      <form id="poll-form">
        <div class="form-group">
          <label>Poll Question</label>
          <input type="text" id="poll-question" class="form-control" placeholder="e.g. Which technology should we learn next?" required>
        </div>
        
        <div class="form-group" id="options-group">
          <label>Poll Options</label>
          <input type="text" class="form-control option-input mb-2" placeholder="Option 1" required>
          <input type="text" class="form-control option-input mb-2" placeholder="Option 2" required>
        </div>

        <button type="button" class="btn btn-outline mb-3" onclick="addOptionInput()">
          <i class="bi bi-plus"></i> Add Option
        </button>

        <button type="submit" class="btn btn-accent style-full">Publish Poll</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/dashboard.js" type="module"></script>
  <script src="js/pollanimation.js"></script>
  <script src="js/poll.js"></script>
</body>
</html>
