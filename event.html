<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Events</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- SUPABASE SDK (Commented for now) -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="/css/event.css">
</head>
<body>


  <!-- HEADER NAVBAR -->
<header class="navbar">
  <div class="nav-container">
    <!-- Brand Logo -->
    <a href="#" class="brand-logo">
      <div class="brand-logo" id="authLogo">
        <!-- QUADPULSE MINIMAL Q+P SVG LOGO -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="42" height="42" fill="none">
          <defs>
            <!-- Cyan to Dark Teal Gradient -->
            <linearGradient id="qpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#72f2eb" />
              <stop offset="100%" stop-color="#0e8388" />
            </linearGradient>

            <!-- Neon Glow Effect -->
            <filter id="qpGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Hexagonal Dark Border Frame -->
          <path d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" 
                stroke="rgba(114, 242, 235, 0.25)" 
                stroke-width="2.5" 
                fill="rgba(5, 22, 24, 0.6)" />

          <!-- Integrated "Q" + "P" Minimalist Cyber Path -->
          <!-- "Q" Outer Circle & Tail -->
          <path d="M50 24 C35 24 25 35 25 50 C25 65 35 76 50 76 C65 76 75 65 75 50 C75 35 65 24 50 24 Z" 
                stroke="url(#qpGradient)" 
                stroke-width="5" 
                stroke-linecap="round" />
          
          <!-- "P" Vertical Stem & Loop Blend -->
          <path d="M38 34 L38 68" 
                stroke="#72f2eb" 
                stroke-width="5" 
                stroke-linecap="round" 
                filter="url(#qpGlow)" />
          
          <path d="M38 34 C50 30 62 38 62 48 C62 58 50 62 38 62" 
                stroke="url(#qpGradient)" 
                stroke-width="4.5" 
                stroke-linecap="round" 
                fill="none" />

          <!-- "Q" Pulse Accent Tail -->
          <path d="M58 58 L72 72" 
                stroke="#72f2eb" 
                stroke-width="5" 
                stroke-linecap="round" 
                filter="url(#qpGlow)" />

          <!-- Pulse Center Glow Node -->
          <circle cx="50" cy="50" r="3.5" fill="#72f2eb" filter="url(#qpGlow)" />
        </svg>
        <span class="logo-text">Quad<span>Pulse</span></span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-menu" id="navMenu">
      <a href="./dashboard.html" class="nav-link active">Dashboard</a>
      <a href="./posts.html" class="nav-link">Posts</a>
      <a href="./event.html" class="nav-link">Events</a>
      <a href="./studypartnerfinder.html" class="nav-link">Study Partners</a>
      <a href="./polls.html" class="nav-link">Polls</a>
    </nav>

    <!-- Right User Actions -->
    <div class="user-actions">
      <button class="notif-btn" title="Notifications">
        <i class="fa-solid fa-bell"></i>
        <span class="notif-badge"></span>
      </button>

      <!-- User Profile Dropdown -->
      <div class="profile-dropdown-wrapper">
        <div class="user-profile-trigger" id="profileTrigger">
          <div class="avatar-circle" id="avatarCircle">
            <span id="avatarInitials">AH</span>
            <img id="avatarImage" src="" alt="Profile" class="avatar-img hidden" />
          </div>
          <span class="user-name" id="userNameDisplay">Ali Hassan</span>
          <i class="fa-solid fa-chevron-down dropdown-icon"></i>
        </div>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" id="profileDropdown">
          <label for="profilePicInput" class="dropdown-item">
            <i class="fa-solid fa-camera"></i>
            <span>Upload Profile Picture</span>
            <input type="file" id="profilePicInput" accept="image/*" class="hidden-input" />
          </label>
          <a href="#" class="dropdown-item">
            <i class="fa-solid fa-gauge"></i>
            <span>Go to Your Dashboard</span>
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-item" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </button>
        </div>
      </div>

      <!-- Mobile Menu Hamburger -->
      <button class="mobile-toggle" id="mobileToggle">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>
</header>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <div class="hero-container">
      <div>
        <h1 class="hero-heading">Campus Events</h1>
        <p class="hero-subtext">Discover, host, and register for upcoming academic and social events.</p>
      </div>
      <button class="btn-primary" onclick="openCreateModal()">
        <i class="fa-solid fa-plus icon-left"></i> Create Event
      </button>
    </div>
  </section>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- SEARCH & FILTERS -->
    <section class="filter-section">
      <div class="search-box-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search events by title, description, or location..." oninput="applyFilters()">
      </div>

      <div class="filter-controls">
        <div class="tab-filters">
          <button class="tab-btn active" id="filterAllBtn" onclick="setTabFilter('all')">All Events</button>
          <button class="tab-btn" id="filterUpcomingBtn" onclick="setTabFilter('upcoming')">Upcoming Events</button>
        </div>

        <select id="categoryFilter" class="category-select" onchange="applyFilters()">
          <option value="all">All Categories</option>
          <option value="Workshop">Workshop</option>
          <option value="Seminar">Seminar</option>
          <option value="Hackathon">Hackathon</option>
          <option value="Social">Social</option>
        </select>
      </div>
    </section>

    <!-- EVENTS GRID -->
    <section class="events-grid" id="eventsContainer">
      <!-- Dynamic Javascript Content -->
    </section>
  </main>

  <!-- CREATE EVENT MODAL -->
  <div class="modal-overlay" id="createEventModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Create New Event</h3>
        <button class="modal-close" onclick="closeCreateModal()">&times;</button>
      </div>

      <form id="createEventForm" onsubmit="handleCreateEvent(event)">
        <div class="form-group">
          <label class="form-label">Event Title</label>
          <input type="text" id="eventTitle" class="form-control" placeholder="e.g. Modern Web Architecture Seminar" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="eventDesc" class="form-control" rows="3" placeholder="Provide event details, prerequisites, or topics covered..." required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" id="eventDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Time</label>
            <input type="time" id="eventTime" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Location / Room</label>
          <input type="text" id="eventLocation" class="form-control" placeholder="e.g. Main Auditorium, Block B" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="eventCategory" class="form-control">
              <option value="Workshop">Workshop</option>
              <option value="Seminar">Seminar</option>
              <option value="Hackathon">Hackathon</option>
              <option value="Social">Social</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Event Image URL</label>
            <input type="url" id="eventImage" class="form-control" placeholder="https://images.unsplash.com/..." required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
          <button type="submit" class="btn-primary" id="submitBtn">Post Event</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/event.js"></script>
</body>
</html>
