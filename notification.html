<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — QuadPulse</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />

 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />


  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/notification.css" />

  <style>
    
    .hidden, .hidden-input { display: none !important; }
    .dropdown-menu { display: none; }
    .dropdown-menu.show { display: block !important; }
  </style>
</head>
<body>


  <header class="navbar">
    <div class="nav-container">
      <!-- Brand Logo -->
      <a href="dashboard.html" class="brand-logo">
        <div class="brand-logo" id="authLogo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="42" height="42" fill="none">
            <defs>
              <linearGradient id="qpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#72f2eb" />
                <stop offset="100%" stop-color="#0e8388" />
              </linearGradient>
              <filter id="qpGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>
            <path d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" stroke="rgba(114, 242, 235, 0.25)" stroke-width="2.5" fill="rgba(5, 22, 24, 0.6)" />
            <path d="M50 24 C35 24 25 35 25 50 C25 65 35 76 50 76 C65 76 75 65 75 50 C75 35 65 24 50 24 Z" stroke="url(#qpGradient)" stroke-width="5" stroke-linecap="round" />
            <path d="M38 34 L38 68" stroke="#72f2eb" stroke-width="5" stroke-linecap="round" filter="url(#qpGlow)" />
            <path d="M38 34 C50 30 62 38 62 48 C62 58 50 62 38 62" stroke="url(#qpGradient)" stroke-width="4.5" stroke-linecap="round" fill="none" />
            <path d="M58 58 L72 72" stroke="#72f2eb" stroke-width="5" stroke-linecap="round" filter="url(#qpGlow)" />
            <circle cx="50" cy="50" r="3.5" fill="#72f2eb" filter="url(#qpGlow)" />
          </svg>
          <span class="logo-text">Quad<span>Pulse</span></span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="nav-menu" id="navMenu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="#" class="nav-link">Posts</a>
        <a href="#" class="nav-link">Events</a>
        <a href="#" class="nav-link">Study Partners</a>
        <a href="#" class="nav-link">Polls</a>
      </nav>

      <!-- Right User Actions -->
      <div class="user-actions">
        <!-- Notification Wrapper -->
        <div class="notification-wrapper" style="position: relative;">
          <button class="notif-btn" id="bellIcon" onclick="toggleNotificationDropdown()" title="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-badge" id="unreadBadge">0</span>
          </button>

          <!-- Dropdown Popup -->
          <div class="notification-dropdown glass-card" id="notifDropdown">
            <div class="notif-header">
              <h4>Notifications</h4>
              <span class="mark-read-link" onclick="markAllAsRead()">Mark all as read</span>
            </div>
            <div class="notif-list" id="notifList">
              <!-- Dynamic Items -->
            </div>
          </div>
        </div>

        <!-- User Profile Dropdown -->
        <div class="profile-dropdown-wrapper">
          <div class="user-profile-trigger" id="profileTrigger">
            <div class="avatar-circle" id="avatarCircle">
              <span id="avatarInitials">AH</span>
              <img id="avatarImage" src="" alt="Profile" class="avatar-img hidden" />
            </div>
            <span class="user-name" id="userNameDisplay">Ali Hassan</span>
            <i class="fa-solid fa-chevron-down dropdown-icon"></i>
          </div>

          <div class="dropdown-menu" id="profileDropdown">
            <label for="profilePicInput" class="dropdown-item">
              <i class="fa-solid fa-camera"></i>
              <span>Upload Profile Picture</span>
              <input type="file" id="profilePicInput" accept="image/*" class="hidden-input" />
            </label>
            <a href="dashboard.html" class="dropdown-item">
              <i class="fa-solid fa-gauge"></i>
              <span>Go to Your Dashboard</span>
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" id="logoutBtn">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>

        <!-- Mobile Toggle -->
        <button class="mobile-toggle" id="mobileToggle">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- NOTIFICATION PAGE MAIN BODY -->
  <main class="dashboard-main" style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
    <div class="section-card">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2><i class="fa-solid fa-bell"></i> Campus Activity Center</h2>
        <button class="btn btn-action" onclick="markAllAsRead()"><i class="fa-solid fa-check-double"></i> Mark all read</button>
      </div>
      <div class="notification-list" id="pageNotifList">
        <!-- Main page notifications rendered here -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/notification.js"></script>
</body>
</html>
